name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify tag and main ancestry
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Expected tag v$version." >&2; exit 1; }
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - run: npm test
      - run: npm run build
      - run: npm pack --ignore-scripts --json | node scripts/verify-package-exports.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: spa-utils-npm-package
          path: '*.tgz'
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: '@mentor-forge'
      - uses: actions/download-artifact@v4
        with:
          name: spa-utils-npm-package
      - name: Publish the verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -- ./*.tgz
          test "$#" -eq 1 && test -f "$1" || { echo "Expected exactly one package tarball." >&2; exit 1; }
          npm publish "$1" --ignore-scripts
